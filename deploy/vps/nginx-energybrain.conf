# /etc/nginx/sites-available/energybrain.xven.app  (then symlink into sites-enabled)
# certbot --nginx -d energybrain.xven.app adds the HTTPS part and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name energybrain.xven.app;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live explainer answers can take several seconds.
        proxy_read_timeout 90s;
    }
}
