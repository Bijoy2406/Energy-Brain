<!doctype html>
<html lang="en" class="splash-active">
  <head>
    <meta name="theme-color" content="#F4F7FB" />
    <script>
      window.__splashStart = performance.now()
      // Resolve the theme before styles or the app can paint; storage may be unavailable.
      var theme
      try { theme = localStorage.getItem('eb-theme') } catch (error) {}
      if (theme !== 'light' && theme !== 'dark') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      document.documentElement.dataset.theme = theme
      document.documentElement.style.colorScheme = theme
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#07111F' : '#F4F7FB' 
      // Show the intro splash once per browser tab: sessionStorage survives reloads but is cleared when the tab closes.
      try {
        if (sessionStorage.getItem('eb-splash-seen')) document.documentElement.classList.replace('splash-active', 'splash-skip')
      } catch (error) {}
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Brain · Dhaka Microgrid Console</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Load fonts without blocking the first paint, so the splash shows at once on slow networks. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <style>
      html.splash-active, html.splash-active body { overflow: hidden; }
      html.splash-skip #splash { display: none; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 45%, #14345f 0%, #0b2545 45%, #061527 100%);
        color: #fff; font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .7s ease, visibility .7s;
        animation: splash-failsafe 0s linear 60s forwards;
      }
      #splash .splash-stage { display: grid; justify-items: center; gap: 22px; transition: transform .7s cubic-bezier(.7,0,.84,0), filter .7s; }
      #splash .splash-mark { width: 120px; height: 120px; overflow: visible; animation: splash-pop .9s cubic-bezier(.2,1.4,.4,1) both; }
      #splash .splash-orbit { transform-origin: 60px 60px; animation: splash-spin 2.4s linear infinite; }
      #splash .splash-orbit circle:first-child { stroke-dasharray: 60 260; }
      #splash .splash-bolt { stroke-dasharray: 240; stroke-dashoffset: 240; animation: splash-draw .9s ease-out .35s forwards, splash-fill .4s ease 1.1s forwards; }
      #splash .splash-glow { opacity: 0; transform-origin: 60px 60px; animation: splash-glow 1.6s ease-out 1.1s infinite; }
      #splash .splash-word { font-size: clamp(28px, 6vw, 44px); font-weight: 700; letter-spacing: .02em; margin: 0; display: flex; gap: .28em; }
      #splash .splash-word span { opacity: 0; transform: translateY(14px); animation: splash-rise .6s ease forwards; }
      #splash .splash-word span:nth-child(1) { animation-delay: .7s; }
      #splash .splash-word span:nth-child(2) { animation-delay: .85s; color: #f5a623; }
      #splash .splash-bar { width: min(220px, 60vw); height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
      #splash .splash-bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #f5a623, #14a38b); animation: splash-load 1.2s ease-in-out infinite; }
      #splash .splash-tag { margin: 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #9fb3cf; opacity: 0; animation: splash-rise .5s ease .6s forwards; }
      #splash.splash-out { opacity: 0; visibility: hidden; }
      #splash.splash-out .splash-stage { transform: scale(6); filter: blur(6px); }
      @keyframes splash-pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes splash-fill { to { fill: #f5a623; } }
      @keyframes splash-glow { 0% { opacity: .7; transform: scale(.7); } 100% { opacity: 0; transform: scale(1.5); } }
      @keyframes splash-rise { to { opacity: 1; transform: none; } }
      @keyframes splash-load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      @keyframes splash-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation-duration: 0s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition: none !important; }
        #splash .splash-bar i { width: 100%; transform: none; }
        #splash.splash-out .splash-stage { transform: none; filter: none; }
      }
    </style>
    <div id="splash" role="status" aria-label="Loading Energy Brain">
      <div class="splash-stage">
        <svg class="splash-mark" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="splash-glow" cx="60" cy="60" r="38" fill="none" stroke="#f5a623" stroke-width="2" />
          <g class="splash-orbit" fill="none" stroke-linecap="round">
            <circle cx="60" cy="60" r="52" stroke="#14a38b" stroke-width="3" />
            <circle cx="60" cy="60" r="52" stroke="rgba(255,255,255,.08)" stroke-width="3" />
          </g>
          <path class="splash-bolt" d="M66 22 L40 66 H58 L52 98 L80 52 H62 Z" fill="transparent" stroke="#f5a623" stroke-width="3.5" stroke-linejoin="round" />
        </svg>
        <p class="splash-word"><span>Energy</span><span>Brain</span></p>
        <div class="splash-bar"><i></i></div>
        <p class="splash-tag">Planning today's energy</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
